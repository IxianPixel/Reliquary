name: Release

# Runs when a version tag (v1.2.3) is pushed. The tag must be on master, match
# versionName in app/build.gradle.kts, and have a section in CHANGELOG.md
# (scripts/prepare-release.py does both on the release/* branch).
# The release job publishes the Android APK. The desktop jobs run after it and attach their packages and the
# VLC source to that release.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the tag is on master

      - name: Check the tag, version and changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG isn't vMAJOR.MINOR.PATCH."; exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG isn't on master. Merge the release/* branch first, then tag master."; exit 1
          fi
          version_name="$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [ "v$version_name" != "$TAG" ]; then
            echo "::error::versionName is $version_name but the tag is $TAG. Run scripts/prepare-release.py on the release branch."; exit 1
          fi
          scripts/changelog-section.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          echo "Release notes:"; cat "$RUNNER_TEMP/notes.md"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(RELEASE_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build release APK
        env:
          RELIQUARY_KEYSTORE: ${{ runner.temp }}/release.jks
          RELIQUARY_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELIQUARY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELIQUARY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Name and check the APK
        id: apk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::No signed APK at $src."; ls app/build/outputs/apk/release; exit 1
          fi
          apk="reliquary-$TAG.apk"
          cp "$src" "$apk"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest"
          sha256sum "$apk" > "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "Reliquary $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # Each desktop job builds one package and attaches it to the release the release job created. The builds are
  # unsigned, so the release notes say how to open them. A failed job can be re-run without rebuilding the rest.
  desktop-macos:
    name: Desktop macOS ${{ matrix.arch }}
    needs: release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build the app
        run: ./gradlew :desktop:packageMacZip --console=plain

      - name: Name, check and upload the app
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(ls desktop/build/compose/binaries/main/zip/*.zip)"
          out="reliquary-$TAG-macos-$ARCH.zip"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          gh release upload "$TAG" "$out" "$out.sha256" --clobber

  desktop-windows:
    name: Desktop Windows
    needs: release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # jpackage builds the MSI with WiX 3, which the runner doesn't include.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.11.2 --yes --no-progress
          $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset*" -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle) { Write-Error "candle.exe not found after installing WiX."; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $candle.DirectoryName

      - name: Build the installer
        shell: bash
        run: ./gradlew :desktop:packageMsi --console=plain

      - name: Name, check and upload the installer
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(ls desktop/build/compose/binaries/main/msi/*.msi)"
          out="reliquary-$TAG-windows-x64.msi"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          gh release upload "$TAG" "$out" "$out.sha256" --clobber

  desktop-linux:
    name: Desktop Linux
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The Linux app uses the system's VLC, so the .deb depends on its packages rather than bundling libVLC.
      - name: Build the .deb
        run: ./gradlew :desktop:packageDeb --console=plain

      - name: Name, check and upload the .deb
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(ls desktop/build/compose/binaries/main/deb/*.deb)"
          out="reliquary-$TAG-linux-amd64.deb"
          cp "$src" "$out"
          if ! dpkg-deb -f "$out" Depends | grep -q libvlc5; then
            echo "::error::$out doesn't depend on libvlc5."; exit 1
          fi
          sha256sum "$out" > "$out.sha256"
          gh release upload "$TAG" "$out" "$out.sha256" --clobber

  # libVLC's source, as the LGPL asks for with the binaries bundled in the macOS and Windows apps.
  vlc-source:
    name: VLC source
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Fetch the VLC source
        run: ./gradlew :desktop:fetchVlcSource --console=plain

      - name: Upload the VLC source
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd desktop/build/vlc-source
          src="$(ls ./*.tar.xz)"
          sha256sum "$src" > "$src.sha256"
          gh release upload "$TAG" "$src" "$src.sha256" --clobber
