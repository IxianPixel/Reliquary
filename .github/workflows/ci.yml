name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # GitHub reports this as the check name; master's ruleset requires it.
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Validates the wrapper and caches Gradle downloads and build outputs.
      - uses: gradle/actions/setup-gradle@v6

      # The runner's preinstalled SDK has accepted licenses, so AGP downloads
      # any missing platform (compileSdk 37) on first use.
      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest :core:model:test lintDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: reliquary-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
